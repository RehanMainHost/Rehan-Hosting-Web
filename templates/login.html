<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Rehan Web Hosting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" method="post" action="/login">
    <div class="brand" style="margin-bottom:18px"><div class="mark"></div><span>Rehan<span class="gold">Host</span></span></div>
    <h1>Sign in</h1>
    <p class="sub">Control panel access</p>
    {% if err %}<div class="badge err" style="margin-bottom:14px">⚠ {{ err }}</div>{% endif %}
    <div class="field">
      <label>Username</label>
      <input name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label>Password</label>
      <input name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn gold" style="width:100%;justify-content:center">Sign in</button>
  </form>
</div>
</body>
</html>
